services:
  calendar-sync:
    build:
      context: .
      dockerfile: Dockerfile

    image: smart-sports-calendar:develop
    container_name: smart-sports-calendar
    restart: unless-stopped

    environment:
      TZ: Europe/Vienna
      DATABASE_PATH: /data/sports.db
      LOG_LEVEL: INFO
      HEARTBEAT_INTERVAL: 300

    volumes:
      - smart_sports_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sqlite3;
          sqlite3.connect('/data/sports.db').execute('SELECT 1')"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

volumes:
  smart_sports_data:
    name: smart_sports_data