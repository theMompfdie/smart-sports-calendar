services:
  calendar-sync:
    build:
      context: .
      dockerfile: Dockerfile

    image: smart-sports-calendar:develop
    pull_policy: build

    container_name: smart-sports-calendar
    restart: unless-stopped

    environment:
      TZ: Europe/Vienna
      DATABASE_PATH: /data/sports.db
      LOG_LEVEL: INFO
      HEARTBEAT_INTERVAL: 300
      M365_TENANT_ID: ${M365_TENANT_ID}
      M365_CLIENT_ID: ${M365_CLIENT_ID}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET}
      M365_USER_ID: ${M365_USER_ID}
      OUTLOOK_CALENDAR_NAME: ${OUTLOOK_CALENDAR_NAME:-SMART Sports Calendar}
      GRAPH_BASE_URL: ${GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      GRAPH_STARTUP_VALIDATION_ENABLED: ${GRAPH_STARTUP_VALIDATION_ENABLED:-true}

    volumes:
      - smart_sports_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sqlite3;
          sqlite3.connect('/data/sports.db').execute('SELECT 1')"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

volumes:
  smart_sports_data:
    name: smart_sports_data