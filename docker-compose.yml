services:
  calendar-sync:
    build:
      context: .
      dockerfile: Dockerfile

    image: smart-sports-calendar:develop
    pull_policy: build

    container_name: smart-sports-calendar
    restart: unless-stopped

    environment:
      TZ: Europe/Vienna
      DATABASE_PATH: /data/sports.db
      LOG_LEVEL: INFO
      HEARTBEAT_INTERVAL: 300
      M365_TENANT_ID: ${M365_TENANT_ID}
      M365_CLIENT_ID: ${M365_CLIENT_ID}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET}
      M365_USER_ID: ${M365_USER_ID}
      OUTLOOK_CALENDAR_NAME: ${OUTLOOK_CALENDAR_NAME:-SMART Sports Calendar}
      OUTLOOK_CALENDAR_ID: ${OUTLOOK_CALENDAR_ID}
      SYNCHRONIZATION_BATCH_LIMIT: ${SYNCHRONIZATION_BATCH_LIMIT:-100}
      GRAPH_BASE_URL: ${GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      GRAPH_STARTUP_VALIDATION_ENABLED: ${GRAPH_STARTUP_VALIDATION_ENABLED:-true}
      API_FOOTBALL_ENABLED: ${API_FOOTBALL_ENABLED:-false}
      API_FOOTBALL_API_KEY: ${API_FOOTBALL_API_KEY:-}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      API_FOOTBALL_CONNECT_TIMEOUT_SECONDS: ${API_FOOTBALL_CONNECT_TIMEOUT_SECONDS:-5}
      API_FOOTBALL_READ_TIMEOUT_SECONDS: ${API_FOOTBALL_READ_TIMEOUT_SECONDS:-30}
      API_FOOTBALL_MAX_ATTEMPTS: ${API_FOOTBALL_MAX_ATTEMPTS:-3}
      API_FOOTBALL_RETRY_BASE_DELAY_SECONDS: ${API_FOOTBALL_RETRY_BASE_DELAY_SECONDS:-1}
      API_FOOTBALL_RETRY_MAX_DELAY_SECONDS: ${API_FOOTBALL_RETRY_MAX_DELAY_SECONDS:-30}
      API_FOOTBALL_IMPORT_INTERVAL_SECONDS: ${API_FOOTBALL_IMPORT_INTERVAL_SECONDS:-3600}

    volumes:
      - smart_sports_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sqlite3;
          sqlite3.connect('/data/sports.db').execute('SELECT 1')"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

volumes:
  smart_sports_data:
    name: smart_sports_data
