services:
  calendar-sync:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${COMPOSE_PROJECT_NAME:-smart-sports-calendar}-calendar-sync:${IMAGE_TAG:-develop}
    pull_policy: build

    restart: unless-stopped

    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-local}
      TZ: ${TZ:-Europe/Vienna}
      DATABASE_PATH: ${DATABASE_PATH:-/data/sports.db}
      MANUAL_IMPORT_ROOT: ${MANUAL_IMPORT_ROOT:-}
      MANUAL_IMPORT_INTERVAL: ${MANUAL_IMPORT_INTERVAL:-60}
      MANUAL_IMPORT_LIMIT: ${MANUAL_IMPORT_LIMIT:-10}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-300}
      M365_TENANT_ID: ${M365_TENANT_ID}
      M365_CLIENT_ID: ${M365_CLIENT_ID}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET}
      M365_USER_ID: ${M365_USER_ID}
      OUTLOOK_CALENDAR_NAME: ${OUTLOOK_CALENDAR_NAME:-SMART Sports Calendar}
      OUTLOOK_CALENDAR_ID: ${OUTLOOK_CALENDAR_ID}
      SYNCHRONIZATION_BATCH_LIMIT: ${SYNCHRONIZATION_BATCH_LIMIT:-100}
      GRAPH_BASE_URL: ${GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      GRAPH_STARTUP_VALIDATION_ENABLED: ${GRAPH_STARTUP_VALIDATION_ENABLED:-true}
      SOURCE_JOBS_JSON: ${SOURCE_JOBS_JSON:-[]}
      FOOTBALL_DATA_ENABLED: ${FOOTBALL_DATA_ENABLED:-false}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      FOOTBALL_DATA_BASE_URL: ${FOOTBALL_DATA_BASE_URL:-https://api.football-data.org}
      FOOTBALL_DATA_CONNECT_TIMEOUT_SECONDS: ${FOOTBALL_DATA_CONNECT_TIMEOUT_SECONDS:-5}
      FOOTBALL_DATA_READ_TIMEOUT_SECONDS: ${FOOTBALL_DATA_READ_TIMEOUT_SECONDS:-30}
      FOOTBALL_DATA_MAX_ATTEMPTS: ${FOOTBALL_DATA_MAX_ATTEMPTS:-3}
      FOOTBALL_DATA_RETRY_BASE_DELAY_SECONDS: ${FOOTBALL_DATA_RETRY_BASE_DELAY_SECONDS:-1}
      FOOTBALL_DATA_RETRY_MAX_DELAY_SECONDS: ${FOOTBALL_DATA_RETRY_MAX_DELAY_SECONDS:-30}
      FOOTBALL_DATA_REQUESTS_PER_MINUTE: ${FOOTBALL_DATA_REQUESTS_PER_MINUTE:-10}
      FOOTBALL_DATA_MINIMUM_REQUEST_INTERVAL_SECONDS: ${FOOTBALL_DATA_MINIMUM_REQUEST_INTERVAL_SECONDS:-6.1}
      OPENLIGADB_ENABLED: ${OPENLIGADB_ENABLED:-false}
      OPENLIGADB_BASE_URL: ${OPENLIGADB_BASE_URL:-https://api.openligadb.de}
      OPENLIGADB_CONNECT_TIMEOUT_SECONDS: ${OPENLIGADB_CONNECT_TIMEOUT_SECONDS:-5}
      OPENLIGADB_READ_TIMEOUT_SECONDS: ${OPENLIGADB_READ_TIMEOUT_SECONDS:-30}
      OPENLIGADB_MAX_ATTEMPTS: ${OPENLIGADB_MAX_ATTEMPTS:-3}
      OPENLIGADB_RETRY_BASE_DELAY_SECONDS: ${OPENLIGADB_RETRY_BASE_DELAY_SECONDS:-1}
      OPENLIGADB_RETRY_MAX_DELAY_SECONDS: ${OPENLIGADB_RETRY_MAX_DELAY_SECONDS:-30}
      OPENLIGADB_MINIMUM_REQUEST_INTERVAL_SECONDS: ${OPENLIGADB_MINIMUM_REQUEST_INTERVAL_SECONDS:-1}
      NFLVERSE_ENABLED: ${NFLVERSE_ENABLED:-false}
      NFLVERSE_CONNECT_TIMEOUT_SECONDS: ${NFLVERSE_CONNECT_TIMEOUT_SECONDS:-5}
      NFLVERSE_READ_TIMEOUT_SECONDS: ${NFLVERSE_READ_TIMEOUT_SECONDS:-30}
      NFLVERSE_MAX_ATTEMPTS: ${NFLVERSE_MAX_ATTEMPTS:-3}
      NFLVERSE_MAX_REDIRECTS: ${NFLVERSE_MAX_REDIRECTS:-3}
      NFLVERSE_MINIMUM_POLL_INTERVAL_SECONDS: ${NFLVERSE_MINIMUM_POLL_INTERVAL_SECONDS:-21600}
      OEFB_ICAL_ENABLED: ${OEFB_ICAL_ENABLED:-false}
      OEFB_ICAL_FEED_URL: ${OEFB_ICAL_FEED_URL:-}
      OEFB_ICAL_CONNECT_TIMEOUT_SECONDS: ${OEFB_ICAL_CONNECT_TIMEOUT_SECONDS:-5}
      OEFB_ICAL_READ_TIMEOUT_SECONDS: ${OEFB_ICAL_READ_TIMEOUT_SECONDS:-30}
      OEFB_ICAL_MAX_ATTEMPTS: ${OEFB_ICAL_MAX_ATTEMPTS:-3}
      OEFB_ICAL_RETRY_BASE_DELAY_SECONDS: ${OEFB_ICAL_RETRY_BASE_DELAY_SECONDS:-1}
      OEFB_ICAL_RETRY_MAX_DELAY_SECONDS: ${OEFB_ICAL_RETRY_MAX_DELAY_SECONDS:-30}
      OEFB_ICAL_MINIMUM_POLL_INTERVAL_SECONDS: ${OEFB_ICAL_MINIMUM_POLL_INTERVAL_SECONDS:-21600}
      API_FOOTBALL_ENABLED: ${API_FOOTBALL_ENABLED:-false}
      API_FOOTBALL_API_KEY: ${API_FOOTBALL_API_KEY:-}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      API_FOOTBALL_CONNECT_TIMEOUT_SECONDS: ${API_FOOTBALL_CONNECT_TIMEOUT_SECONDS:-5}
      API_FOOTBALL_READ_TIMEOUT_SECONDS: ${API_FOOTBALL_READ_TIMEOUT_SECONDS:-30}
      API_FOOTBALL_MAX_ATTEMPTS: ${API_FOOTBALL_MAX_ATTEMPTS:-3}
      API_FOOTBALL_RETRY_BASE_DELAY_SECONDS: ${API_FOOTBALL_RETRY_BASE_DELAY_SECONDS:-1}
      API_FOOTBALL_RETRY_MAX_DELAY_SECONDS: ${API_FOOTBALL_RETRY_MAX_DELAY_SECONDS:-30}
      API_FOOTBALL_IMPORT_INTERVAL_SECONDS: ${API_FOOTBALL_IMPORT_INTERVAL_SECONDS:-3600}

    volumes:
      - smart_sports_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, sqlite3;
          sqlite3.connect(os.environ['DATABASE_PATH']).execute('SELECT 1')"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    labels:
      org.smart-sports-calendar.instance: ${INSTANCE_NAME:-local}

volumes:
  smart_sports_data:
