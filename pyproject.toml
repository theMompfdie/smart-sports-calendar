[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "smart-sports-calendar"
version = "0.6.0b1"
description = "Synchronizes sports events with a Microsoft Outlook calendar."
requires-python = ">=3.13"
dependencies = [
    "icalendar==7.3.0",
    "tzdata>=2026.1",
]


[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = [
    "tests",
    "tests.*",
    "data",
    "data.*",
    "config",
    "config.*",
]


[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "scripts", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
